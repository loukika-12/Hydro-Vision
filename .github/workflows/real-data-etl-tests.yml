name: Real-data ETL tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [real-data-ingestion]

jobs:
  etl-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ETL test dependency
        run: python -m pip install --upgrade pip pandas
      - name: Run real-data ETL validation tests
        run: python -m unittest tests.test_real_data_etl -v
